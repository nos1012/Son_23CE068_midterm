name: C build and smoke tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with warnings enabled
        run: make
      - name: Run smoke tests
        run: make test
      - name: Verify cleanup
        run: |
          make clean
          test ! -e ls
          for object in main.o options.o list.o format.o; do
            test ! -e "$object"
          done
